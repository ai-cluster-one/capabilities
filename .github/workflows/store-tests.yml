name: Store tests

# Runs the store-backed suites against a real PostgreSQL. Informational: this
# job is not a required status, and the release gate reads only `verify` in
# source-integrity.yml.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ci
          # Trust, as a developer's throwaway cluster has it: the store-outage
          # suites rewrite the store setting to a relay and carry no password.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The capability suites read a throwaway database each from these.
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: ci
      TASKS_TEST_DSN: postgresql://ci@127.0.0.1:5432/tasks_test?sslmode=disable
      MEMORY_TEST_DSN: postgresql://ci@127.0.0.1:5432/memory_test?sslmode=disable
      AGENTROOMS_TEST_DSN: postgresql://ci@127.0.0.1:5432/agentrooms_test?sslmode=disable
      AUTOMATIONS_TEST_DSN: postgresql://ci@127.0.0.1:5432/automations_test?sslmode=disable
      ASKPROJECT_TEST_DSN: postgresql://ci@127.0.0.1:5432/askproject_test?sslmode=disable
      WHATSAPP_TEST_DSN: postgresql://ci@127.0.0.1:5432/whatsapp_test?sslmode=disable
      TELEGRAM_TEST_DSN: postgresql://ci@127.0.0.1:5432/telegram_test?sslmode=disable
      UV_PYTHON: "3.12"
      # The suites run each script under a home of the test's own; a shared
      # cache keeps those runs from downloading every dependency again.
      UV_CACHE_DIR: /tmp/uv-cache
      # The dev-session suite commits in scratch repositories.
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Put PostgreSQL server tools and this checkout's manager on PATH
        # The manager suites start their own clusters with initdb and pg_ctl,
        # and capabilities run from a scratch directory ask `capabilities` on
        # PATH to resolve their project.
        run: |
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          bindir="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)"
          test -x "$bindir/initdb" && test -x "$bindir/pg_ctl"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: Prepare every script's environment
        # A script run for the first time reports its downloads on stderr,
        # which a suite reading that stderr as JSON would take for its answer.
        run: |
          for script in bin/capabilities capabilities/*/bin/*; do
            uv sync -q --script "$script" || echo "::warning::no environment for $script"
          done
      - name: Create one database per capability suite
        run: |
          for db in tasks_test memory_test agentrooms_test automations_test askproject_test whatsapp_test telegram_test; do
            psql -d ci -v ON_ERROR_STOP=1 -c "create database $db encoding 'UTF8' template template0"
          done
      - name: Manager suite
        run: |
          excluded=(
            # ContextKit is not installed here; these bind a project to it and fail as contextkit_unavailable.
            --deselect tests/test_manager_contextkit_integration.py::test_contextkit_init_skips_both_host_bindings
            --deselect tests/test_manager_contextkit_integration.py::test_contextkit_init_and_context_preserve_owned_files
            --deselect tests/test_manager_contextkit_integration.py::test_doctor_does_not_judge_contextkit_owned_codex_paths
            --deselect tests/test_manager_contextkit_integration.py::test_context_fragment_is_manager_owned_and_write_free
            --deselect tests/test_manager_contextkit_integration.py::test_contextkit_enable_updates_gate_without_generating_context
            --deselect tests/test_manager_contextkit_integration.py::test_context_does_not_render_connection_menu
            --deselect tests/test_manager_contextkit_integration.py::test_contextkit_init_retires_only_legacy_capabilities_wiring
            --deselect tests/test_manager_contextkit_integration.py::test_init_migrates_legacy_hidden_envelope
            --deselect tests/test_manager_contextkit_integration.py::test_init_merges_contextkit_empty_gate_with_legacy_gate
            --deselect tests/test_deployment_lifecycle.py::test_dockerfile_contextkit_has_doctor_after_capabilities_init
            --deselect tests/test_deployment_lifecycle.py::test_dockerfile_contextkit_does_not_duplicate_capabilities_init
            --deselect tests/test_deployment_lifecycle.py::test_dockerfile_ordering_capabilities_to_contextkit
            # Fail on main on any host: telegram service init no longer writes service/voice-agent.md.
            --deselect tests/test_manager_bundle_install.py::test_install_from_source_script_installs_bundle
            --deselect tests/test_manager_bundle_install.py::test_update_migrates_script_source_to_bundle
            # Fails on main on any host: the daemon it starts has no store and exits with store_not_configured.
            --deselect tests/test_manager_bundle_install.py::test_telegram_daemon_sigterm_stops_without_traceback
          )
          uv run --no-project --with pytest --with "psycopg[binary]>=3.2" --with "httpx>=0.27" \
            --with capabilities-contract==0.5.1 \
            pytest tests -q -rfEs "${excluded[@]}"

      # Each capability suite runs on its own: collected together, their
      # `_cli` helper modules shadow one another.
      - name: tasks suite
        if: ${{ !cancelled() }}
        run: |
          excluded=(
            # Fail on main on any host: project profile files are refused as profiles_not_imported.
            --deselect capabilities/tasks/tests/test_cross_project.py::test_the_grant_takes_the_task_until_a_task_of_its_own_takes_it_in
            --deselect capabilities/tasks/tests/test_cross_project.py::test_a_worker_without_the_grant_never_reaches_the_task
            # Fails on main on any host after Oct 9 2026: the weekly reset it reads as "Oct 9" now lands a year later.
            --deselect "capabilities/tasks/tests/test_handlers.py::test_a_usage_limit_holds_the_lane_and_spends_no_attempt[You've hit your weekly limit \xb7 resets Oct 9, 10am (Europe/Berlin)-claude]"
            # The suite's relay closes its listener without shutting it down; on Linux the port keeps accepting, so the store never goes away.
            --deselect capabilities/tasks/tests/test_service.py::test_the_daemon_outlives_the_store_going_away_and_listens_again
            --deselect capabilities/tasks/tests/test_service.py::test_a_lost_question_connection_is_asked_for_again_on_the_doubling_interval
            --deselect capabilities/tasks/tests/test_service.py::test_a_lost_listener_is_asked_for_again_on_the_doubling_interval
            --deselect capabilities/tasks/tests/test_store_outage.py::test_a_command_waits_out_a_store_that_is_away_and_gives_up_after_its_window
            --deselect capabilities/tasks/tests/test_store_outage.py::test_doctor_proves_the_store_as_it_is_now
          )
          uv run --no-project --with pytest --with "psycopg[binary]>=3.2" --with "pyyaml>=6" \
            --with capabilities-contract==0.5.1 --with callva-harness-runner==0.9.0 \
            pytest capabilities/tasks/tests -q -rfEs "${excluded[@]}"
      - name: memory suite
        if: ${{ !cancelled() }}
        run: |
          uv run --no-project --with pytest --with "psycopg[binary]>=3.2" \
            --with capabilities-contract==0.5.1 --with callva-harness-runner==0.9.0 \
            pytest capabilities/memory/tests -q -rfEs
      - name: agentrooms suite
        if: ${{ !cancelled() }}
        run: |
          uv run --no-project --with pytest --with "psycopg[binary]>=3.2" --with "httpx>=0.27" --with "pyyaml>=6" \
            --with capabilities-contract==0.5.1 --with callva-harness-runner==0.9.0 \
            pytest capabilities/agentrooms/tests -q -rfEs
      - name: automations suite
        if: ${{ !cancelled() }}
        run: |
          excluded=(
            # The claude CLI is not installed here; both refuse as engine_not_found.
            --deselect capabilities/automations/tests/test_automations.py::AutomationsTests::test_agent_command_fences_read_and_opens_write
            --deselect capabilities/automations/tests/test_automations.py::AutomationsTests::test_agent_command_hands_only_act_the_machine
          )
          uv run --no-project --with pytest --with "psycopg[binary]>=3.2" \
            --with capabilities-contract==0.5.1 \
            pytest capabilities/automations/tests -q -rfEs "${excluded[@]}"
      - name: askproject suite
        if: ${{ !cancelled() }}
        run: |
          uv run --no-project --with pytest --with "psycopg[binary]>=3.2" --with "httpx>=0.27" \
            --with capabilities-contract==0.5.1 --with callva-harness-runner==0.9.0 \
            pytest capabilities/askproject/tests -q -rfEs
      - name: whatsapp suite
        if: ${{ !cancelled() }}
        run: |
          excluded=(
            # On Linux, `ps -o command=` run from the suite cuts the stand-in holder's command line at 80 columns, so it is never recognised as a listener.
            --deselect capabilities/whatsapp/tests/test_liveness.py::Takeover::test_a_stale_holder_is_ended_and_the_account_taken
            --deselect capabilities/whatsapp/tests/test_liveness.py::Takeover::test_a_stale_holder_that_listens_to_sigterm_is_not_killed
            # On main on any host the suite closes the stream pytest captures into, and pytest then fails at exit; it runs uncaptured.
            --capture=no
          )
          uv run --no-project --with pytest --with "psycopg[binary]>=3.2" --with "httpx>=0.27" \
            --with "puremagic>=1.28" --with "qrcode>=7.4" --with capabilities-contract==0.5.1 \
            --with callva-harness-runner==0.9.0 \
            --with "neonize @ https://github.com/ai-cluster-one/neonize/releases/download/v0.5.2-histsync.1/neonize-0.5.2-py3-none-any.whl" \
            pytest capabilities/whatsapp/tests -q -rfEs "${excluded[@]}"
      - name: telegram suite
        if: ${{ !cancelled() }}
        run: |
          uv run --no-project --with pytest --with "psycopg[binary]>=3.2" --with "httpx>=0.27" \
            --with "qrcode>=7.4" --with telethon==1.45.0 --with jsonschema \
            --with "google-genai>=1.36.0" --with "openai>=3.16.0" --with "psycopg2-binary>=2.9" \
            --with capabilities-contract==0.5.1 --with callva-harness-runner==0.10.0 \
            pytest capabilities/telegram/tests -q -rfEs
