name: Source integrity

on:
  pull_request:
  push:
    branches:
      - main
      - "capabilities-release/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Verify immutable source tree
        run: ./bin/capabilities source verify official --ref HEAD
