# Profile "whatsapp-codex": a WhatsApp dialogue turn on codex.
#
# The turn has the access a worker needs to answer from the project: full
# access, approvals never asked, and the project's hooks run without trust
# recorded on the machine. The room's authority is not here: the service hands
# it to each run as CAPABILITIES_AUTH_CONTEXT. A turn is ended sooner by the
# room's worker_timeout; this deadline is only the ceiling.

harness = "codex"
model = "sol"
approval_policy = "never"
codex_config = { sandbox_mode = "danger-full-access" }
bypass_hook_trust = true
timeout_seconds = 3600
