# Profile "whatsapp-job-claude": a WhatsApp job on claude.
#
# A job is handed work out of a dialogue turn and runs until it is done, with
# the same access a dialogue turn has: every tool without a permission prompt,
# and the user's, project's and local settings. The requester's authority is
# not here: the service hands it to each run as CAPABILITIES_AUTH_CONTEXT. A
# job has no room waiting on it, so this deadline is its only one.

harness = "claude"
model = "opus"
permission_mode = "bypassPermissions"
setting_sources = ["user", "project", "local"]
timeout_seconds = 86400
