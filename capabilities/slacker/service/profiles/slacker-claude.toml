# Profile "slacker-claude": a Slack dialogue turn on claude.
#
# The turn has the access a worker needs to answer from the project: every
# tool without a permission prompt, and the user's, project's and local
# settings, as `claude -p` loads them. The conversation's authority is not here: the
# service hands it to each run as CAPABILITIES_AUTH_CONTEXT. A turn is ended
# sooner by the conversation's worker_timeout; this deadline is only the ceiling.

harness = "claude"
model = "opus"
permission_mode = "bypassPermissions"
setting_sources = ["user", "project", "local"]
timeout_seconds = 3600
