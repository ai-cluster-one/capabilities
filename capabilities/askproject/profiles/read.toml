# askproject profile "read": a research question to a peer in another project.
#
# The peer is held to reading by instruction alone. It has every tool, a full
# shell and the network, with no tool fence and no OS sandbox, and it loads the
# target project's own context. CAPABILITIES_READ_ONLY makes every capability
# call it makes read-only.
#
# Each table is one callva-agentworker 0.2.0 profile; --engine picks the table.
# askproject appends its own bridge instruction to append_system_prompt, and
# --model, --effort and --timeout (or their ASKPROJECT_* variables) override the
# values here for the engine that runs.

[claude]
engine = "claude"
model = "claude-opus-5-5"
effort = "medium"
timeout_seconds = 3600
permission_mode = "bypassPermissions"
setting_sources = ["project", "local"]
append_system_prompt = "This is a READ-ONLY research query. Change nothing: no file writes or edits, no commits, and no state changes in this project or in any system you reach. Read, run read-only commands, and answer."
env_set = { CAPABILITIES_READ_ONLY = "1" }

[codex]
engine = "codex"
model = "gpt-6-sol"
effort = "medium"
timeout_seconds = 3600
approval_policy = "never"
codex_config = { sandbox_mode = "danger-full-access" }
append_system_prompt = "This is a READ-ONLY research query. Change nothing: no file writes or edits, no commits, and no state changes in this project or in any system you reach. Read, run read-only commands, and answer."
env_set = { CAPABILITIES_READ_ONLY = "1" }
