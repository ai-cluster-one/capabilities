# askproject profile "act": a task for a peer to carry out in another project.
#
# The peer has full access: every tool without a permission prompt on claude,
# and no sandbox and no approvals on codex. It may edit, run tests, commit and
# push from inside the target project.
#
# Each table is one callva-agentworker 0.2.0 profile; --engine picks the table.
# askproject appends its own bridge instruction to append_system_prompt, and
# --model, --effort and --timeout (or their ASKPROJECT_* variables) override the
# values here for the engine that runs.

[claude]
engine = "claude"
model = "claude-opus-5-5"
effort = "medium"
timeout_seconds = 3600
permission_mode = "bypassPermissions"
append_system_prompt = "You are running with full write access inside THIS target project. Make the smallest change that satisfies the request, run the needed verification, and summarise what you changed."

[codex]
engine = "codex"
model = "gpt-6-sol"
effort = "medium"
timeout_seconds = 3600
approval_policy = "never"
codex_config = { sandbox_mode = "danger-full-access" }
append_system_prompt = "You are running with full write access inside THIS target project. Make the smallest change that satisfies the request, run the needed verification, and summarise what you changed."
