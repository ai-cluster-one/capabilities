# Profile "telegrambot-claude": a telegrambot dialogue turn on claude.
#
# The turn answers from the project it runs in: every tool without a
# permission prompt, and the user's, project's and local settings, as
# `claude -p` loads them. The room's authority is not here: the service hands
# it to each run as CAPABILITIES_AUTH_CONTEXT. A turn ends sooner at the
# room's worker_timeout; this deadline is only the ceiling.

harness = "claude"
model = "opus"
permission_mode = "bypassPermissions"
setting_sources = ["user", "project", "local"]
timeout_seconds = 3600
