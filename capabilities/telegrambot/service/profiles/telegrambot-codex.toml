# Profile "telegrambot-codex": a telegrambot dialogue turn on codex.
#
# The turn answers from the project it runs in: full access, approvals never
# asked, and the project's hooks run without trust recorded on the machine.
# The room's authority is not here: the service hands it to each run as
# CAPABILITIES_AUTH_CONTEXT. A turn ends sooner at the room's worker_timeout;
# this deadline is only the ceiling.

harness = "codex"
model = "sol"
approval_policy = "never"
codex_config = { sandbox_mode = "danger-full-access" }
bypass_hook_trust = true
timeout_seconds = 3600
