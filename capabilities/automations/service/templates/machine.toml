# The machine automations service: one process on this machine serving every
# project the node manager puts on its list, those placed on this node in mode
# shared (`capabilities service start automations`). Each project's own
# declaration and limits still apply; these are the machine's. `automations help`
# states every key; any other is refused.
version = 1

# Jobs running at once across every joined project. Absent: only each
# project's own limits apply.
max_parallel = 8
